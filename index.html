    render();
    const again = document.getElementById('template-search');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  };

  document.querySelectorAll('[data-tag-filter]').forEach(el => el.onclick = () => {
    templateTagFilter = el.getAttribute('data-tag-filter');
    render();
  });

  const toggleCombineBtn = document.querySelector('[data-toggle-combine]');
  if (toggleCombineBtn) toggleCombineBtn.onclick = () => {
    combineMode = !combineMode;
    combineSelection = []; combineError = '';
    render();
  };

  document.querySelectorAll('[data-combine-pick]').forEach(el => el.onchange = () => {
    const id = el.getAttribute('data-combine-pick');
    if (el.checked) { if (!combineSelection.includes(id)) combineSelection.push(id); }
    else combineSelection = combineSelection.filter(x => x !== id);
    render();
  });

  const runCombineBtn = document.querySelector('[data-run-combine]');
  if (runCombineBtn) runCombineBtn.onclick = () => { if (!combineLoading) runCombine(); };

  document.querySelectorAll('[data-back-to-templates]').forEach(el => el.onclick = () => {
    combineResult = null; combineMode = false; combineSelection = [];
    view = 'templates'; render();
  });

  const saveCombinedBtn = document.querySelector('[data-save-combined]');
  if (saveCombinedBtn) saveCombinedBtn.onclick = () => {
    const r = combineResult;
    if (!r) return;
    const title = document.getElementById('combine-title').value.trim();
    if (!title) { showToast('Give the template a name first'); return; }
    state.templates.push({
      id: uid('tpl'),
      title,
      subject: document.getElementById('combine-subject').value,
      body: document.getElementById('combine-body').value,
      tags: document.getElementById('combine-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      requiredRoleIds: r.requiredRoleIds,
      recipientRoleId: r.recipientRoleId,
      signerSource: r.signerSource,
      folderId: r.folderId,
    });
    combineResult = null; combineMode = false; combineSelection = [];
    saveState(); view = 'templates'; render(); showToast('Combined template saved');
  };

  document.querySelectorAll('[data-new-template]').forEach(el => el.onclick = () => { editingTemplateId = null; view='editor'; render(); });

  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => { editingTemplateId = el.getAttribute('data-edit'); view='editor'; render(); });

  document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-delete');
    if (confirm('Delete this template? This cannot be undone.')) { state.templates = state.templates.filter(t=>t.id!==id); saveState(); render(); }
  });

  document.querySelectorAll('[data-fav]').forEach(el => el.onclick = () => {
    const t = state.templates.find(x => x.id === el.getAttribute('data-fav'));
    if (!t) return;
    t.favorite = !t.favorite;
    saveState(); render();
    showToast(t.favorite ? 'Added to favorites' : 'Removed from favorites');
  });

  document.querySelectorAll('[data-generate]').forEach(el => el.onclick = () => {
    generatingTemplateId = el.getAttribute('data-generate');
    genFieldValues = {}; genOutput=''; genSubject=''; genError=''; genLanguage = state.lastLanguage || 'English (no translation)';
    view='generate'; render();
  });

  const roleToggles = document.querySelectorAll('[data-role-toggle]');
  if (roleToggles.length) {
    getEditorDraftFromDom();
    roleToggles.forEach(el => el.onchange = () => {
      const id = el.getAttribute('data-role-toggle');
      const d = getEditorDraftFromDom();
      if (el.checked) { if (!d.requiredRoleIds.includes(id)) d.requiredRoleIds.push(id); }
      else { d.requiredRoleIds = d.requiredRoleIds.filter(x=>x!==id); if (d.recipientRoleId===id) d.recipientRoleId=''; if (d.signerSource===id) d.signerSource='sender'; }
      persistEditorDraft(d); render();
    });
  }

  const insertRoleSel = document.getElementById('tpl-insert-role');
  if (insertRoleSel) insertRoleSel.onchange = () => { insertRoleSelection = insertRoleSel.value; syncEditorDraftFromDom(); render(); };

  document.querySelectorAll('[data-insert-kind]').forEach(el => el.onclick = () => {
    const kind = el.getAttribute('data-insert-kind');
    const roleId = insertRoleSelection;
    let token;
    if (roleId === 'sender') { token = kind === 'email' ? '{{Sender Email}}' : '{{Sender Name}}'; }
    else {
      const r = state.roles.find(x=>x.id===roleId);
      if (!r) return;
      token = kind==='name' ? nameToken(r.label) : kind==='first' ? firstNameToken(r.label) : kind==='last' ? lastNameToken(r.label) : kind==='email' ? emailToken(r.label) : idToken(r.label);
    }
    const target = document.getElementById(insertTargetId) || document.getElementById('tpl-body');
    if (target) { insertAtCursor(target, token); syncEditorDraftFromDom(); }
  });

  ['tpl-subject','tpl-body'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onfocus = () => { insertTargetId = id; };
  });

  ['tpl-title','tpl-subject','tpl-body','tpl-recipient','tpl-signer','tpl-folder'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => syncEditorDraftFromDom();
  });

  const saveTplBtn = document.querySelector('[data-save-template]');
  if (saveTplBtn) saveTplBtn.onclick = () => {
    const d = getEditorDraftFromDom();
    if (!d.title.trim()) { showToast('Give the template a name first'); return; }
    if (d.id) { state.templates[state.templates.findIndex(t=>t.id===d.id)] = d; }
    else { d.id = uid('tpl'); state.templates.push(d); }
    saveState(); editingTemplateId = null; view = 'templates'; showToast('Template saved');
  };

  document.querySelectorAll('[data-role-rename]').forEach(el => el.onchange = () => {
    const id = el.getAttribute('data-role-rename');
    const role = state.roles.find(r=>r.id===id);
    if (!role) return;
    const oldLabel = role.label, newLabel = el.value.trim() || oldLabel;
    if (newLabel === oldLabel) return;
    state.templates.forEach(t => {
      t.body = t.body.split(nameToken(oldLabel)).join(nameToken(newLabel));
      t.body = t.body.split(firstNameToken(oldLabel)).join(firstNameToken(newLabel));
      t.body = t.body.split(lastNameToken(oldLabel)).join(lastNameToken(newLabel));
      t.body = t.body.split(emailToken(oldLabel)).join(emailToken(newLabel));
      t.body = t.body.split(idToken(oldLabel)).join(idToken(newLabel));
    });
    role.label = newLabel; saveState(); render(); showToast('Role renamed everywhere');
  });

  document.querySelectorAll('[data-role-delete]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-role-delete');
    if (!confirm('Remove this role?')) return;
    state.roles = state.roles.filter(r=>r.id!==id);
    state.templates.forEach(t => {
      t.requiredRoleIds = t.requiredRoleIds.filter(x=>x!==id);
      if (t.recipientRoleId===id) t.recipientRoleId='';
      if (t.signerSource===id) t.signerSource='sender';
    });
    saveState(); render();
  });

  const addRoleBtn = document.querySelector('[data-add-role]');
  if (addRoleBtn) addRoleBtn.onclick = () => {
    const input = document.getElementById('new-role-label');
    const label = input.value.trim();
    if (!label) return;
    state.roles.push({ id: uid('r'), label, locked:false });
    saveState(); render();
  };

  const saveSenderBtn = document.querySelector('[data-save-sender]');
  if (saveSenderBtn) saveSenderBtn.onclick = () => {
    state.sender.name = document.getElementById('sender-name').value.trim();
    state.sender.email = document.getElementById('sender-email').value.trim();
    saveState(); showToast('Sender info saved');
  };

  const downloadBackupBtn = document.querySelector('[data-download-backup]');
  if (downloadBackupBtn) downloadBackupBtn.onclick = () => {
    const stamp = todayKey();
    downloadJson(state, `dispatch-backup-${stamp}.json`);
    showToast('Backup downloaded');
  };

  const restoreBtn = document.querySelector('[data-restore-backup]');
  if (restoreBtn) restoreBtn.onclick = () => {
    const fileInput = document.getElementById('restore-file');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if (!file) { showToast('Pick a backup file first'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try { incoming = JSON.parse(reader.result); }
      catch(e){ showToast('That file could not be read'); return; }
      const { addedTemplates, addedMembers, addedRoles, addedArticles } = mergeIntoState(incoming);
      saveState(); render();
      showToast(`Restored ${addedTemplates} template${addedTemplates===1?'':'s'}, ${addedMembers} member${addedMembers===1?'':'s'}, ${addedRoles} role${addedRoles===1?'':'s'}, ${addedArticles} article${addedArticles===1?'':'s'}`);
    };
    reader.readAsText(file);
  };

  const recoverLegacyBtn = document.querySelector('[data-recover-legacy]');
  if (recoverLegacyBtn) recoverLegacyBtn.onclick = () => {
    const legacy = readLegacyLocalState();
    if (!legacy) { showToast('Nothing found to recover'); return; }
    const { addedTemplates, addedMembers, addedRoles, addedArticles } = mergeIntoState(legacy);
    saveState(); render();
    showToast(`Recovered ${addedTemplates} template${addedTemplates===1?'':'s'}, ${addedMembers} member${addedMembers===1?'':'s'}, ${addedRoles} role${addedRoles===1?'':'s'}, ${addedArticles} article${addedArticles===1?'':'s'}`);
  };

  const memberSearchEl = document.getElementById('member-search');
  if (memberSearchEl) memberSearchEl.oninput = () => {
    memberSearchQuery = memberSearchEl.value;
    const cursorPos = memberSearchEl.selectionStart;
    render();
    const refocused = document.getElementById('member-search');
    if (refocused) { refocused.focus(); refocused.setSelectionRange(cursorPos, cursorPos); }
  };

  const openAddMemberBtn = document.querySelector('[data-open-add-member]');
  if (openAddMemberBtn) openAddMemberBtn.onclick = () => {
    editingMemberId = 'new'; memberDraft = blankMember(''); bulkImportOpen = false; bulkPreview = null; render();
  };

  const openBulkImportBtn = document.querySelector('[data-open-bulk-import]');
  if (openBulkImportBtn) openBulkImportBtn.onclick = () => {
    bulkImportOpen = !bulkImportOpen; editingMemberId = null; memberDraft = null; bulkPreview = null; render();
  };

  document.querySelectorAll('[data-edit-member]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-edit-member');
    const m = state.members[id];
    if (!m) return;
    editingMemberId = id; memberDraft = Object.assign({}, m); bulkImportOpen = false; render();
  });

  document.querySelectorAll('[data-delete-member]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-delete-member');
    if (!confirm('Delete this member? This cannot be undone.')) return;
    delete state.members[id];
    saveState(); render();
  });

  const saveMemberBtn = document.querySelector('[data-save-member]');
  if (saveMemberBtn) saveMemberBtn.onclick = () => {
    const isNew = editingMemberId === 'new';
    const id = document.getElementById('mf-id').value.trim();
    const firstName = document.getElementById('mf-first').value.trim();
    const lastName = document.getElementById('mf-last').value.trim();
    if (!id || !firstName || !lastName) { showToast('Member ID, first and last name are required'); return; }
    if (isNew && state.members[id]) { showToast('That Member ID already exists — edit it instead'); return; }
    const record = {
      id,
      firstName, lastName,
      email: document.getElementById('mf-email').value.trim(),
      phone: document.getElementById('mf-phone').value.trim(),
      country: document.getElementById('mf-country').value.trim(),
      sponsor: document.getElementById('mf-sponsor').value.trim(),
      enroller: document.getElementById('mf-enroller').value.trim(),
      notes: document.getElementById('mf-notes').value.trim(),
    };
    state.members[id] = record;
    editingMemberId = null; memberDraft = null;
    saveState(); render(); showToast('Member saved');
  };

  const cancelMemberBtn = document.querySelector('[data-cancel-member]');
  if (cancelMemberBtn) cancelMemberBtn.onclick = () => { editingMemberId = null; memberDraft = null; render(); };

  const previewBulkBtn = document.querySelector('[data-preview-bulk]');
  if (previewBulkBtn) previewBulkBtn.onclick = () => {
    bulkImportText = document.getElementById('bulk-import-text').value;
    bulkPreview = computeBulkPreview(bulkImportText);
    render();
  };

  const confirmBulkBtn = document.querySelector('[data-confirm-bulk]');
  if (confirmBulkBtn) confirmBulkBtn.onclick = () => {
    if (!bulkPreview) return;
    bulkPreview.newRecords.forEach(r => { state.members[r.id] = blankMember(r.id); state.members[r.id].firstName = r.firstName; state.members[r.id].lastName = r.lastName; });
    const count = bulkPreview.newRecords.length;
    saveState();
    bulkImportOpen = false; bulkImportText = ''; bulkPreview = null;
    render(); showToast(`${count} member${count===1?'':'s'} imported`);
  };

  const cancelBulkBtn = document.querySelector('[data-cancel-bulk]');
  if (cancelBulkBtn) cancelBulkBtn.onclick = () => { bulkImportOpen = false; bulkImportText = ''; bulkPreview = null; render(); };

  document.querySelectorAll('[data-gen-field]').forEach(el => el.oninput = () => { genFieldValues[el.getAttribute('data-gen-field')] = el.value; });
  document.querySelectorAll('[data-gen-field]').forEach(el => {
    const key = el.getAttribute('data-gen-field');
    if (key.endsWith('_firstname') || key.endsWith('_lastname')) {
      const roleId = key.replace(/_(firstname|lastname)$/, '');
      el.onblur = () => { maybeParseCommaName(roleId); render(); };
    }
    if (key.endsWith('_memberid')) {
      const roleId = key.replace(/_memberid$/, '');
      el.onblur = () => { applyPersonLookup(roleId); render(); };
    }
  });
  const langSel = document.getElementById('gen-language');
  if (langSel) langSel.onchange = () => { genLanguage = langSel.value; state.lastLanguage = langSel.value; saveState(); };
  const runBtn = document.querySelector('[data-run-generate]');
  if (runBtn) runBtn.onclick = runGenerate;
  const copyBtn = document.querySelector('[data-copy-output]');
  if (copyBtn) copyBtn.onclick = () => {
    const full = genSubject ? `Subject: ${genSubject}\n\n${genOutput}` : genOutput;
    navigator.clipboard.writeText(full).then(()=>showToast(genSubject ? 'Subject and body copied' : 'Copied'));
  };
  const copySubjectBtn = document.querySelector('[data-copy-subject]');
  if (copySubjectBtn) copySubjectBtn.onclick = () => {
    navigator.clipboard.writeText(genSubject).then(()=>showToast('Subject copied'));
  };
}

let __editorDraft = null;
function getEditorDraftFromDom(init){
  if (init || !__editorDraft) {
    __editorDraft = editingTemplateId
      ? JSON.parse(JSON.stringify(state.templates.find(t=>t.id===editingTemplateId)))
      : newTemplateDraft();
  }
  return __editorDraft;
}
function syncEditorDraftFromDom(){
  const d = getEditorDraftFromDom();
  d.title = document.getElementById('tpl-title')?.value ?? d.title;
  d.subject = document.getElementById('tpl-subject')?.value ?? d.subject;
  const tagsEl = document.getElementById('tpl-tags');
  if (tagsEl) d.tags = tagsEl.value.split(',').map(s => s.trim()).filter(Boolean);
  d.body = document.getElementById('tpl-body')?.value ?? d.body;
  d.recipientRoleId = document.getElementById('tpl-recipient')?.value ?? d.recipientRoleId;
  d.signerSource = document.getElementById('tpl-signer')?.value ?? d.signerSource;
  d.folderId = document.getElementById('tpl-folder')?.value ?? d.folderId;
  __editorDraft = d;
}
function persistEditorDraft(d){ __editorDraft = d; }

const origRender = render;
render = function(){ if (view !== 'editor') __editorDraft = null; origRender(); };

function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

loadState();
</script>
</body>
</html>
