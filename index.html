<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch — Email Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  :root{
    --bg:#F6F6FB; --sidebar:#FAFAFA; --card:#FFFFFF; --border:#E8E8F1; --ink:#20223A; --muted:#7A7C99;
    --primary:#5B54E8; --primary-dark:#4842C9; --primary-soft:#EEEDFD;
    --accent:#FF8A65; --accent-soft:#FFEFE8;
  }
  html,body{ height:100%; margin:0; }
  body{ font-family:'Inter',Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D9D9EA; border-radius:4px; }
  svg{ display:block; flex-shrink:0; }
  textarea,input,select{ outline:none; font-family:'Inter',Arial,sans-serif; }
  .app{ display:flex; height:100vh; overflow:hidden; }

  /* sidebar */
  .sidebar{ width:250px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto; }
  .logo-row{ display:flex; align-items:center; gap:8px; padding:4px 6px 14px; }
  .logo-mark{ width:28px; height:28px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .logo-text{ font-weight:700; font-size:15px; }
  .btn{ border-radius:10px; font-weight:600; cursor:pointer; border:1px solid transparent; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-ghost{ border-color:var(--border); background:#fff; color:var(--ink); }
  .btn-ghost:hover{ background:#F2F1FA; }
  .btn-block{ width:100%; padding:9px 12px; }
  .sidebar-new{ margin-bottom:16px; }
  .nav-title{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:10px 8px 6px; display:flex; align-items:center; justify-content:space-between; }
  .nav-title button{ background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; display:flex; }
  .nav-title button:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .nav-item{ display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:9px; cursor:pointer; color:var(--ink); font-size:13.5px; }
  .nav-item:hover{ background:#F0EFFA; }
  .nav-item.active{ background:var(--primary-soft); color:var(--primary-dark); font-weight:600; }
  .nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .count{ font-size:11px; color:var(--muted); }
  .nav-bottom{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }

  /* main */
  .main{ flex:1; overflow-y:auto; padding:26px 34px 60px; }
  .main-inner{ max-width:900px; }
  .page-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .page-title{ font-size:20px; font-weight:700; }
  .subtle{ color:var(--muted); font-size:13.5px; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
  .tpl-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .tpl-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .tpl-title{ font-weight:600; font-size:14.5px; }
  .badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .tpl-preview{ color:var(--muted); font-size:13px; margin:8px 0 12px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tpl-actions{ display:flex; gap:6px; align-items:center; }
  .icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--muted); cursor:pointer; }
  .icon-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); border-color:var(--primary-soft); }
  .icon-btn.danger:hover{ background:#FDECEA; color:#D0453A; border-color:#FDECEA; }

  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-icon{ width:44px; height:44px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }

  label.section{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:5px; }
  .field{ margin-bottom:16px; }
  input, textarea, select{ width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:14px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus, select:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint{ font-size:12px; color:var(--muted); margin-top:5px; }

  .role-chip{ border:1.5px solid var(--border); border-radius:999px; padding:6px 13px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; background:#fff; }
  .role-chip.active{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }

  .insert-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .insert-row select{ width:auto; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:13.5px; cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0; }
  .back-link:hover{ color:var(--ink); }

  .translate-bar{ display:flex; align-items:center; gap:10px; background:var(--primary-soft); border-radius:12px; padding:12px 14px; margin-bottom:16px; flex-wrap:wrap; }
  .translate-bar label{ font-size:12.5px; font-weight:700; color:var(--primary-dark); white-space:nowrap; }
  .translate-bar select{ flex:1; min-width:160px; }

  .role-block{ border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
  .role-pill{ font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); display:inline-block; margin-bottom:8px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 820px){ .two-col{ grid-template-columns:1fr; } .app{ flex-direction:column; height:auto; } .sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; } .nav-bottom{ margin-top:0; border-top:none; } }

  .toast{ position:fixed; top:18px; right:18px; background:var(--ink); color:#fff; padding:9px 16px; border-radius:10px; font-size:13.5px; z-index:50; }
  .output-box{ white-space:pre-wrap; font-size:14px; line-height:1.6; min-height:180px; }
</style>
</head>
<body>

<div id="root"></div>

<script>
const STORAGE_KEY = 'dispatch-state-v2';
const DEFAULT_STATE = {
  sender: { name: '', email: '' },
  roles: [
    { id: 'r_moving', label: 'Moving Member', locked: true },
    { id: 'r_enroller', label: 'Enroller', locked: true },
    { id: 'r_sponsor', label: 'Proposed Sponsor', locked: true },
  ],
  templates: [],
  people: {},
  folders: [],
  lastLanguage: 'English (no translation)',
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let view = 'templates';
let selectedFolderId = null; // null = all templates
let editingTemplateId = null;
let generatingTemplateId = null;
let genFieldValues = {};
let genLanguage = 'English (no translation)';
let genOutput = '';
let genLoading = false;
let genError = '';
let toast = '';
let insertRoleSelection = 'sender';

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

async function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
    else {
      // migrate from v1 if present
      const old = localStorage.getItem('dispatch-state-v1');
      if (old) state = Object.assign({}, DEFAULT_STATE, JSON.parse(old));
    }
  } catch (e) {}
  if (!state.folders) state.folders = [];
  render();
}
async function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}
function showToast(msg){ toast = msg; render(); setTimeout(()=>{ toast=''; render(); }, 1800); }

function nameToken(label){ return `{{${label} Name}}`; }
function emailToken(label){ return `{{${label} Email}}`; }
function firstNameToken(label){ return `{{${label} First Name}}`; }
function lastNameToken(label){ return `{{${label} Last Name}}`; }
function idToken(label){ return `{{${label} ID}}`; }

function insertAtCursor(textarea, text){
  const start = textarea.selectionStart, end = textarea.selectionEnd;
  const val = textarea.value;
  textarea.value = val.slice(0,start) + text + val.slice(end);
  textarea.selectionStart = textarea.selectionEnd = start + text.length;
  textarea.focus();
}

function icon(name, size){
  const s = size || 16;
  const map = {
    sparkle: '<path d="M12 3l1.7 4.8L18.5 9.5l-4.8 1.7L12 16l-1.7-4.8L5.5 9.5l4.8-1.7L12 3z"/>',
    inbox: '<path d="M3 12h4.5l1.5 2.5h6L16.5 12H21"/><rect x="3" y="6" width="18" height="14" rx="2"/>',
    folder: '<path d="M3 7.5A1.5 1.5 0 014.5 6h4.7l1.8 2.2h8.5A1.5 1.5 0 0121 9.7v8.8A1.5 1.5 0 0119.5 20h-15A1.5 1.5 0 013 18.5v-11z"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-4 3-6.2 6.5-6.2s6.5 2.2 6.5 6.2"/><circle cx="17.5" cy="9.3" r="2.3"/><path d="M15.5 20c.2-3.1 1.9-5 5-5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4.2 20c0-4.4 3.5-7 7.8-7s7.8 2.6 7.8 7"/>',
    pencil: '<path d="M14.2 3.8l6 6L8.3 21.7l-6.1 1.1 1.1-6.1L14.2 3.8z"/>',
    trash: '<path d="M3.5 6.5h17"/><path d="M8.5 6.5v-2a1.5 1.5 0 011.5-1.5h4a1.5 1.5 0 011.5 1.5v2"/><path d="M6 6.5l1 14h10l1-14"/>',
    copy: '<rect x="9" y="9" width="11.5" height="11.5" rx="2.2"/><path d="M5 14.5V5.2A2.2 2.2 0 017.2 3h9.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chevronLeft: '<path d="M14.5 5l-7 7 7 7"/>',
    wand: '<path d="M4 20L18 6"/><path d="M15 3l1.2 2.8L19 7l-2.8 1.2L15 11l-1.2-2.8L11 7l2.8-1.2L15 3z"/>',
    idcard: '<rect x="3" y="5.5" width="18" height="13" rx="2.3"/><circle cx="8.3" cy="11.3" r="1.7"/><path d="M5.5 16c.4-1.7 1.6-2.5 2.8-2.5s2.4.8 2.8 2.5"/><path d="M13.5 10h5M13.5 13h5"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9s1.3-6.5 3.8-9z"/>',
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${map[name]||''}</svg>`;
}

// ---------------- render ----------------
function render(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="app">
      ${sidebarHtml()}
      <main class="main"><div class="main-inner">${mainBody()}</div></main>
    </div>
    ${toast ? `<div class="toast">${toast}</div>` : ''}
  `;
  attachHandlers();
}

function sidebarHtml(){
  const allCount = state.templates.length;
  return `
    <aside class="sidebar">
      <div class="logo-row"><div class="logo-mark">${icon('sparkle',15)}</div><div class="logo-text">Dispatch</div></div>
      <button data-new-template class="btn btn-primary btn-block sidebar-new">${icon('plus',15)} New template</button>

      <div class="nav-title"><span>Folders</span><button data-add-folder title="New folder">${icon('plus',13)}</button></div>
      <div data-select-folder="" class="nav-item ${view==='templates'&&selectedFolderId===null?'active':''}">${icon('inbox',15)}<span class="lbl">All templates</span><span class="count">${allCount}</span></div>
      ${state.folders.map(f => {
        const count = state.templates.filter(t=>t.folderId===f.id).length;
        return `<div data-select-folder="${f.id}" class="nav-item ${view==='templates'&&selectedFolderId===f.id?'active':''}">${icon('folder',15)}<span class="lbl">${escapeHtml(f.name)}</span><span class="count">${count}</span></div>`;
      }).join('')}

      <div class="nav-bottom">
        <div data-nav="roles" class="nav-item ${view==='roles'?'active':''}">${icon('users',15)}<span class="lbl">Roles</span></div>
        <div data-nav="sender" class="nav-item ${view==='sender'?'active':''}">${icon('user',15)}<span class="lbl">Sender</span></div>
      </div>
    </aside>
  `;
}

function mainBody(){
  if (view === 'templates') return viewTemplates();
  if (view === 'editor') return viewEditor();
  if (view === 'roles') return viewRoles();
  if (view === 'sender') return viewSender();
  if (view === 'generate') return viewGenerate();
  return '';
}

// ---------------- Templates ----------------
function viewTemplates(){
  const folder = selectedFolderId ? state.folders.find(f=>f.id===selectedFolderId) : null;
  const list = state.templates.filter(t => selectedFolderId ? t.folderId===selectedFolderId : true);
  return `
    <div class="page-header">
      <div class="page-title">${folder ? escapeHtml(folder.name) : 'All templates'}</div>
      <button data-new-template class="btn btn-primary" style="padding:8px 14px;">${icon('plus',15)} New template</button>
    </div>
    ${list.length === 0 ? `
      <div class="card empty">
        <div class="empty-icon">${icon('mail',20)}</div>
        <div>No templates ${folder ? 'in this folder' : 'yet'}.</div>
      </div>
    ` : `
      <div class="grid">
        ${list.map(t => templateCard(t)).join('')}
      </div>
    `}
  `;
}

function templateCard(t){
  const roleCount = t.requiredRoleIds.length;
  return `
    <div class="tpl-card">
      <div class="tpl-card-top">
        <div class="tpl-title">${escapeHtml(t.title || 'Untitled')}</div>
        <span class="badge">${roleCount} role${roleCount===1?'':'s'}</span>
      </div>
      <div class="tpl-preview">${escapeHtml((t.body||'').slice(0,100))}${(t.body||'').length>100?'…':''}</div>
      <div class="tpl-actions">
        <button data-generate="${t.id}" class="btn btn-primary" style="flex:1; padding:7px 10px; font-size:13px;">${icon('wand',14)} Generate</button>
        <button data-edit="${t.id}" class="icon-btn" title="Edit">${icon('pencil',15)}</button>
        <button data-delete="${t.id}" class="icon-btn danger" title="Delete">${icon('trash',15)}</button>
      </div>
    </div>
  `;
}

// ---------------- Editor ----------------
function viewEditor(){
  const t = getEditorDraftFromDom();
  const roles = state.roles;
  const insertOptions = [{id:'sender', label:'Sender'}, ...t.requiredRoleIds.map(id => state.roles.find(r=>r.id===id)).filter(Boolean)];
  if (!insertOptions.find(o=>o.id===insertRoleSelection)) insertRoleSelection = 'sender';

  return `
    <button data-nav="templates" class="back-link">${icon('chevronLeft',14)} Back</button>
    <div class="card">
      <div class="field">
        <label class="section">Template name</label>
        <input id="tpl-title" value="${escapeAttr(t.title)}" placeholder="New Moving Member Welcome" />
      </div>

      <div class="field">
        <label class="section">Folder</label>
        <select id="tpl-folder">
          <option value="">No folder</option>
          ${state.folders.map(f => `<option value="${f.id}" ${t.folderId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label class="section">Roles needed</label>
        <div class="chip-row">
          ${roles.map(r => `
            <label class="role-chip ${t.requiredRoleIds.includes(r.id) ? 'active' : ''}">
              <input type="checkbox" style="display:none" data-role-toggle="${r.id}" ${t.requiredRoleIds.includes(r.id)?'checked':''} />
              ${escapeHtml(r.label)}
            </label>
          `).join('')}
        </div>
      </div>

      <div class="row2 field">
        <div>
          <label class="section">Say "hello" to</label>
          <select id="tpl-recipient">
            <option value="">No auto-greeting</option>
            ${t.requiredRoleIds.map(id => { const r = roles.find(x=>x.id===id); return `<option value="${id}" ${t.recipientRoleId===id?'selected':''}>${escapeHtml(r?.label||'')}</option>`; }).join('')}
          </select>
        </div>
        <div>
          <label class="section">Signed by</label>
          <select id="tpl-signer">
            <option value="sender" ${t.signerSource==='sender'?'selected':''}>Sender (you)</option>
            ${t.requiredRoleIds.map(id => { const r = roles.find(x=>x.id===id); return `<option value="${id}" ${t.signerSource===id?'selected':''}>${escapeHtml(r?.label||'')}</option>`; }).join('')}
          </select>
        </div>
      </div>

      <div class="field">
        <label class="section">Insert into body</label>
        <p class="hint" style="margin:0 0 8px;">1. Pick who it's for below, then 2. tap what to insert.</p>
        <div class="insert-row" style="margin-bottom:8px;">
          <select id="tpl-insert-role">
            ${insertOptions.map(o => `<option value="${o.id}" ${insertRoleSelection===o.id?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
          </select>
        </div>
        <div class="insert-row">
          <button data-insert-kind="name" class="btn btn-ghost" style="padding:6px 11px; font-size:12.5px;">${icon('user',13)} Full name</button>
          <button data-insert-kind="first" class="btn btn-ghost" style="padding:6px 11px; font-size:12.5px;">First name</button>
          <button data-insert-kind="last" class="btn btn-ghost" style="padding:6px 11px; font-size:12.5px;">Last name</button>
          <button data-insert-kind="email" class="btn btn-ghost" style="padding:6px 11px; font-size:12.5px;">${icon('mail',13)} Email</button>
          <button data-insert-kind="id" class="btn btn-ghost" style="padding:6px 11px; font-size:12.5px;">${icon('idcard',13)} Member ID</button>
        </div>
      </div>

      <div class="field">
        <label class="section">Body</label>
        <textarea id="tpl-body" rows="9" placeholder="Write the email here — click the buttons above to drop in a placeholder.">${escapeHtml(t.body)}</textarea>
        <p class="hint">Greeting and signature are added automatically — no need to type them here.</p>
      </div>

      <div style="display:flex; gap:8px;">
        <button data-save-template class="btn btn-primary" style="padding:9px 20px;">Save template</button>
        <button data-nav="templates" class="btn btn-ghost" style="padding:9px 16px;">Cancel</button>
      </div>
    </div>
  `;
}

function newTemplateDraft(){
  return { id: null, title: '', body: '', requiredRoleIds: [], recipientRoleId: '', signerSource: 'sender', folderId: selectedFolderId || '' };
}

// ---------------- Roles ----------------
function viewRoles(){
  return `
    <div class="page-header"><div class="page-title">Roles</div></div>
    <div class="card" style="max-width:480px;">
      ${state.roles.map(r => `
        <div style="display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:11px; padding:8px 10px; margin-bottom:8px;">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon('user',13)}</div>
          <input data-role-rename="${r.id}" value="${escapeAttr(r.label)}" style="border:none; padding:2px; flex:1;" />
          ${r.locked ? `<span class="subtle" style="font-size:11px;">default</span>` : `<button data-role-delete="${r.id}" class="icon-btn danger" style="width:26px;height:26px;">${icon('trash',13)}</button>`}
        </div>
      `).join('')}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="new-role-label" placeholder="Add a role, e.g. Legal Reviewer" />
        <button data-add-role class="btn btn-primary" style="padding:0 14px;">${icon('plus',15)}</button>
      </div>
    </div>
  `;
}

// ---------------- Sender ----------------
function viewSender(){
  return `
    <div class="page-header"><div class="page-title">Sender</div></div>
    <div class="card" style="max-width:400px;">
      <div style="width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:10px;">${icon('user',17)}</div>
      <div class="field"><label class="section">Your name</label><input id="sender-name" value="${escapeAttr(state.sender.name)}" /></div>
      <div class="field"><label class="section">Your email</label><input id="sender-email" value="${escapeAttr(state.sender.email)}" /></div>
      <button data-save-sender class="btn btn-primary" style="padding:8px 16px;">Save</button>
    </div>
  `;
}

// ---------------- Generate ----------------
const LANGUAGES = ['English (no translation)','Spanish','Portuguese','French','Mandarin Chinese','Tagalog','Vietnamese','Korean','Haitian Creole','Russian','Arabic','Somali'];

function viewGenerate(){
  const t = state.templates.find(x=>x.id===generatingTemplateId);
  if (!t) return `<p>Template not found.</p>`;
  const roles = t.requiredRoleIds.map(id => state.roles.find(r=>r.id===id)).filter(Boolean);
  return `
    <button data-nav="templates" class="back-link">${icon('chevronLeft',14)} Back</button>
    <div class="page-header"><div class="page-title">${escapeHtml(t.title)}</div></div>

    <div class="translate-bar">
      <label>${icon('globe',15)} Translate to</label>
      <select id="gen-language">${LANGUAGES.map(l => `<option ${genLanguage===l?'selected':''}>${l}</option>`).join('')}</select>
      <button data-run-generate class="btn btn-primary" style="padding:9px 16px;" ${genLoading?'disabled':''}>${genLoading ? 'Generating…' : icon('wand',15)+' Generate'}</button>
    </div>
    ${genError ? `<p style="color:#D0453A; font-size:13.5px; margin:-8px 0 14px;">${escapeHtml(genError)}</p>` : ''}

    <div class="two-col">
      <div class="card">
        <label class="section">Sender</label>
        <div class="row2" style="margin-bottom:12px;">
          <input data-gen-field="__sender_name" placeholder="Name" value="${escapeAttr(genFieldValues.__sender_name ?? state.sender.name)}" />
          <input data-gen-field="__sender_email" placeholder="Email" value="${escapeAttr(genFieldValues.__sender_email ?? state.sender.email)}" />
        </div>

        ${roles.map(r => {
          const needsEmail = (r.id === t.recipientRoleId) || (t.body||'').includes(emailToken(r.label));
          return `
          <div class="role-block">
            <span class="role-pill">${escapeHtml(r.label)}</span>
            <div class="row2" style="margin-bottom:8px;">
              <input data-gen-field="${r.id}_firstname" placeholder="First name" value="${escapeAttr(genFieldValues[r.id+'_firstname']||'')}" />
              <input data-gen-field="${r.id}_lastname" placeholder="Last name" value="${escapeAttr(genFieldValues[r.id+'_lastname']||'')}" />
            </div>
            <div class="${needsEmail ? 'row2' : ''}">
              ${needsEmail ? `<input data-gen-field="${r.id}_email" placeholder="Email" value="${escapeAttr(genFieldValues[r.id+'_email']||'')}" />` : ''}
              <input data-gen-field="${r.id}_memberid" placeholder="Member ID" value="${escapeAttr(genFieldValues[r.id+'_memberid']||'')}" />
            </div>
          </div>
        `;}).join('')}
      </div>

      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <label class="section" style="margin:0;">Output</label>
          ${genOutput ? `<button data-copy-output class="icon-btn" title="Copy">${icon('copy',14)}</button>` : ''}
        </div>
        <div class="output-box">${genOutput ? escapeHtml(genOutput) : '<span class="subtle">Fill in the fields, then hit Generate.</span>'}</div>
      </div>
    </div>
  `;
}

// ---------------- generation logic ----------------
function maybeParseCommaName(roleId){
  const firstKey = roleId + '_firstname', lastKey = roleId + '_lastname';
  [firstKey, lastKey].forEach(key => {
    const val = (genFieldValues[key] || '');
    if (val.includes(',')) {
      const parts = val.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length === 2) { genFieldValues[lastKey] = parts[0]; genFieldValues[firstKey] = parts[1]; }
    }
  });
}
function lookupPersonById(roleId, id){
  if (!id) return null;
  const list = (state.people && state.people[roleId]) || [];
  return list.find(p => p.id === id) || null;
}
function applyPersonLookup(roleId){
  const id = (genFieldValues[roleId+'_memberid'] || '').trim();
  const match = lookupPersonById(roleId, id);
  if (match) {
    genFieldValues[roleId+'_firstname'] = match.firstName;
    genFieldValues[roleId+'_lastname'] = match.lastName;
    genFieldValues[roleId+'_email'] = match.email;
    showToast(`Found ${match.firstName} ${match.lastName}`.trim());
  }
}
function savePeopleFromGenFields(t){
  state.people = state.people || {};
  t.requiredRoleIds.forEach(roleId => {
    const id = (genFieldValues[roleId+'_memberid'] || '').trim();
    if (!id) return;
    const record = { id, firstName: genFieldValues[roleId+'_firstname']||'', lastName: genFieldValues[roleId+'_lastname']||'', email: genFieldValues[roleId+'_email']||'' };
    if (!state.people[roleId]) state.people[roleId] = [];
    const idx = state.people[roleId].findIndex(p => p.id === id);
    if (idx >= 0) state.people[roleId][idx] = record; else state.people[roleId].push(record);
  });
  saveState();
}

function buildFilledBody(t){
  let body = t.body || '';
  const senderName = genFieldValues.__sender_name ?? state.sender.name ?? '';
  const senderEmail = genFieldValues.__sender_email ?? state.sender.email ?? '';
  body = body.split('{{Sender Name}}').join(senderName);
  body = body.split('{{Sender Email}}').join(senderEmail);

  const roleData = {};
  t.requiredRoleIds.forEach(id => {
    const r = state.roles.find(x=>x.id===id);
    if (!r) return;
    const firstName = genFieldValues[id+'_firstname'] || '';
    const lastName = genFieldValues[id+'_lastname'] || '';
    const email = genFieldValues[id+'_email'] || '';
    const memberId = genFieldValues[id+'_memberid'] || '';
    const fullName = [firstName, lastName].filter(Boolean).join(' ');
    roleData[id] = { name: fullName, firstName, lastName, email, memberId, label: r.label };
    body = body.split(nameToken(r.label)).join(fullName);
    body = body.split(firstNameToken(r.label)).join(firstName);
    body = body.split(lastNameToken(r.label)).join(lastName);
    body = body.split(emailToken(r.label)).join(email);
    body = body.split(idToken(r.label)).join(memberId);
  });

  let greeting = '';
  if (t.recipientRoleId && roleData[t.recipientRoleId]) greeting = `Hello ${roleData[t.recipientRoleId].name || '[name]'},\n\n`;

  let signature = '';
  if (t.signerSource === 'sender') signature = `\n\n${senderName}\n${senderEmail}`;
  else if (roleData[t.signerSource]) signature = `\n\n${roleData[t.signerSource].name}\n${roleData[t.signerSource].email}`;

  return greeting + body + signature;
}

async function translateText(text, targetLang){
  const resp = await fetch("/.netlify/functions/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, targetLang })
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Translation request failed (' + resp.status + ')'));
  if (!data.translated) throw new Error('No translation returned');
  return data.translated;
}

async function runGenerate(){
  const t = state.templates.find(x=>x.id===generatingTemplateId);
  if (!t) return;
  genError = '';
  savePeopleFromGenFields(t);
  const filled = buildFilledBody(t);
  if (genLanguage === 'English (no translation)') { genOutput = filled; render(); return; }
  genLoading = true; genOutput = ''; render();
  try { genOutput = await translateText(filled, genLanguage); }
  catch (e) { genError = 'Translation failed — showing the English version instead. ' + (e.message || ''); genOutput = filled; }
  genLoading = false; render();
}

// ---------------- event handling ----------------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => {
    view = el.getAttribute('data-nav');
    if (view==='templates'){ editingTemplateId=null; }
    render();
  });

  document.querySelectorAll('[data-select-folder]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-select-folder');
    selectedFolderId = id || null;
    view = 'templates';
    render();
  });

  const addFolderBtn = document.querySelector('[data-add-folder]');
  if (addFolderBtn) addFolderBtn.onclick = () => {
    const name = prompt('Folder name:');
    if (!name || !name.trim()) return;
    state.folders.push({ id: uid('f'), name: name.trim() });
    saveState(); render();
  };

  document.querySelectorAll('[data-new-template]').forEach(el => el.onclick = () => { editingTemplateId = null; view='editor'; render(); });

  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => { editingTemplateId = el.getAttribute('data-edit'); view='editor'; render(); });

  document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-delete');
    if (confirm('Delete this template? This cannot be undone.')) { state.templates = state.templates.filter(t=>t.id!==id); saveState(); render(); }
  });

  document.querySelectorAll('[data-generate]').forEach(el => el.onclick = () => {
    generatingTemplateId = el.getAttribute('data-generate');
    genFieldValues = {}; genOutput=''; genError=''; genLanguage = state.lastLanguage || 'English (no translation)';
    view='generate'; render();
  });

  const roleToggles = document.querySelectorAll('[data-role-toggle]');
  if (roleToggles.length) {
    getEditorDraftFromDom();
    roleToggles.forEach(el => el.onchange = () => {
      const id = el.getAttribute('data-role-toggle');
      const d = getEditorDraftFromDom();
      if (el.checked) { if (!d.requiredRoleIds.includes(id)) d.requiredRoleIds.push(id); }
      else { d.requiredRoleIds = d.requiredRoleIds.filter(x=>x!==id); if (d.recipientRoleId===id) d.recipientRoleId=''; if (d.signerSource===id) d.signerSource='sender'; }
      persistEditorDraft(d); render();
    });
  }

  const insertRoleSel = document.getElementById('tpl-insert-role');
  if (insertRoleSel) insertRoleSel.onchange = () => { insertRoleSelection = insertRoleSel.value; syncEditorDraftFromDom(); render(); };

  document.querySelectorAll('[data-insert-kind]').forEach(el => el.onclick = () => {
    const kind = el.getAttribute('data-insert-kind');
    const roleId = insertRoleSelection;
    let token;
    if (roleId === 'sender') { token = kind === 'email' ? '{{Sender Email}}' : '{{Sender Name}}'; }
    else {
      const r = state.roles.find(x=>x.id===roleId);
      if (!r) return;
      token = kind==='name' ? nameToken(r.label) : kind==='first' ? firstNameToken(r.label) : kind==='last' ? lastNameToken(r.label) : kind==='email' ? emailToken(r.label) : idToken(r.label);
    }
    const ta = document.getElementById('tpl-body');
    if (ta) { insertAtCursor(ta, token); syncEditorDraftFromDom(); }
  });

  ['tpl-title','tpl-body','tpl-recipient','tpl-signer','tpl-folder'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => syncEditorDraftFromDom();
  });

  const saveTplBtn = document.querySelector('[data-save-template]');
  if (saveTplBtn) saveTplBtn.onclick = () => {
    const d = getEditorDraftFromDom();
    if (!d.title.trim()) { showToast('Give the template a name first'); return; }
    if (d.id) { state.templates[state.templates.findIndex(t=>t.id===d.id)] = d; }
    else { d.id = uid('tpl'); state.templates.push(d); }
    saveState(); editingTemplateId = null; view = 'templates'; showToast('Template saved');
  };

  document.querySelectorAll('[data-role-rename]').forEach(el => el.onchange = () => {
    const id = el.getAttribute('data-role-rename');
    const role = state.roles.find(r=>r.id===id);
    if (!role) return;
    const oldLabel = role.label, newLabel = el.value.trim() || oldLabel;
    if (newLabel === oldLabel) return;
    state.templates.forEach(t => {
      t.body = t.body.split(nameToken(oldLabel)).join(nameToken(newLabel));
      t.body = t.body.split(firstNameToken(oldLabel)).join(firstNameToken(newLabel));
      t.body = t.body.split(lastNameToken(oldLabel)).join(lastNameToken(newLabel));
      t.body = t.body.split(emailToken(oldLabel)).join(emailToken(newLabel));
      t.body = t.body.split(idToken(oldLabel)).join(idToken(newLabel));
    });
    role.label = newLabel; saveState(); render(); showToast('Role renamed everywhere');
  });

  document.querySelectorAll('[data-role-delete]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-role-delete');
    if (!confirm('Remove this role?')) return;
    state.roles = state.roles.filter(r=>r.id!==id);
    state.templates.forEach(t => {
      t.requiredRoleIds = t.requiredRoleIds.filter(x=>x!==id);
      if (t.recipientRoleId===id) t.recipientRoleId='';
      if (t.signerSource===id) t.signerSource='sender';
    });
    saveState(); render();
  });

  const addRoleBtn = document.querySelector('[data-add-role]');
  if (addRoleBtn) addRoleBtn.onclick = () => {
    const input = document.getElementById('new-role-label');
    const label = input.value.trim();
    if (!label) return;
    state.roles.push({ id: uid('r'), label, locked:false });
    saveState(); render();
  };

  const saveSenderBtn = document.querySelector('[data-save-sender]');
  if (saveSenderBtn) saveSenderBtn.onclick = () => {
    state.sender.name = document.getElementById('sender-name').value.trim();
    state.sender.email = document.getElementById('sender-email').value.trim();
    saveState(); showToast('Sender info saved');
  };

  document.querySelectorAll('[data-gen-field]').forEach(el => el.oninput = () => { genFieldValues[el.getAttribute('data-gen-field')] = el.value; });
  document.querySelectorAll('[data-gen-field]').forEach(el => {
    const key = el.getAttribute('data-gen-field');
    if (key.endsWith('_firstname') || key.endsWith('_lastname')) {
      const roleId = key.replace(/_(firstname|lastname)$/, '');
      el.onblur = () => { maybeParseCommaName(roleId); render(); };
    }
    if (key.endsWith('_memberid')) {
      const roleId = key.replace(/_memberid$/, '');
      el.onblur = () => { applyPersonLookup(roleId); render(); };
    }
  });
  const langSel = document.getElementById('gen-language');
  if (langSel) langSel.onchange = () => { genLanguage = langSel.value; state.lastLanguage = langSel.value; saveState(); };
  const runBtn = document.querySelector('[data-run-generate]');
  if (runBtn) runBtn.onclick = runGenerate;
  const copyBtn = document.querySelector('[data-copy-output]');
  if (copyBtn) copyBtn.onclick = () => { navigator.clipboard.writeText(genOutput).then(()=>showToast('Copied')); };
}

let __editorDraft = null;
function getEditorDraftFromDom(init){
  if (init || !__editorDraft) {
    __editorDraft = editingTemplateId
      ? JSON.parse(JSON.stringify(state.templates.find(t=>t.id===editingTemplateId)))
      : newTemplateDraft();
  }
  return __editorDraft;
}
function syncEditorDraftFromDom(){
  const d = getEditorDraftFromDom();
  d.title = document.getElementById('tpl-title')?.value ?? d.title;
  d.body = document.getElementById('tpl-body')?.value ?? d.body;
  d.recipientRoleId = document.getElementById('tpl-recipient')?.value ?? d.recipientRoleId;
  d.signerSource = document.getElementById('tpl-signer')?.value ?? d.signerSource;
  d.folderId = document.getElementById('tpl-folder')?.value ?? d.folderId;
  __editorDraft = d;
}
function persistEditorDraft(d){ __editorDraft = d; }

const origRender = render;
render = function(){ if (view !== 'editor') __editorDraft = null; origRender(); };

function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

loadState();
</script>
