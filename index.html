<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch — Email Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  :root{
    --bg:#F6F6FB; --sidebar:#FAFAFA; --card:#FFFFFF; --border:#E8E8F1; --ink:#20223A; --muted:#7A7C99;
    --primary:#5B54E8; --primary-dark:#4842C9; --primary-soft:#EEEDFD;
    --accent:#FF8A65; --accent-soft:#FFEFE8;
  }
  html,body{ height:100%; margin:0; }
  body{ font-family:'Inter',Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D9D9EA; border-radius:4px; }
  svg{ display:block; flex-shrink:0; }
  textarea,input,select{ outline:none; font-family:'Inter',Arial,sans-serif; }
  .app{ display:flex; height:100vh; overflow:hidden; }

  /* sidebar */
  .sidebar{ width:250px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto; }
  .logo-row{ display:flex; align-items:center; gap:8px; padding:4px 6px 14px; }
  .logo-mark{ width:28px; height:28px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .logo-text{ font-weight:700; font-size:15px; }
  .btn{ border-radius:10px; font-weight:600; cursor:pointer; border:1px solid transparent; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-ghost{ border-color:var(--border); background:#fff; color:var(--ink); }
  .btn-ghost:hover{ background:#F2F1FA; }
  .btn-block{ width:100%; padding:9px 12px; }
  .sidebar-new{ margin-bottom:16px; }
  .nav-title{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:10px 8px 6px; display:flex; align-items:center; justify-content:space-between; }
  .nav-title button{ background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; display:flex; }
  .nav-title button:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .nav-item{ display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:9px; cursor:pointer; color:var(--ink); font-size:13.5px; }
  .nav-item:hover{ background:#F0EFFA; }
  .nav-item.active{ background:var(--primary-soft); color:var(--primary-dark); font-weight:600; }
  .nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .count{ font-size:11px; color:var(--muted); }
  .nav-bottom{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }

  /* main */
  .main{ flex:1; overflow-y:auto; padding:26px 34px 60px; }
  .main-inner{ max-width:900px; }
  .page-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .page-title{ font-size:20px; font-weight:700; }
  .subtle{ color:var(--muted); font-size:13.5px; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
  .tpl-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .tpl-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .tpl-title{ font-weight:600; font-size:14.5px; }
  .badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .tpl-preview{ color:var(--muted); font-size:13px; margin:8px 0 12px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tpl-actions{ display:flex; gap:6px; align-items:center; }
  .icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--muted); cursor:pointer; }
  .icon-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); border-color:var(--primary-soft); }
  .icon-btn.danger:hover{ background:#FDECEA; color:#D0453A; border-color:#FDECEA; }

  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-icon{ width:44px; height:44px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }

  label.section{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:5px; }
  .field{ margin-bottom:16px; }
  input, textarea, select{ width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:14px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus, select:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint{ font-size:12px; color:var(--muted); margin-top:5px; }

  .role-chip{ border:1.5px solid var(--border); border-radius:999px; padding:6px 13px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; background:#fff; }
  .role-chip.active{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }

  .insert-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .insert-row select{ width:auto; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:13.5px; cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0; }
  .back-link:hover{ color:var(--ink); }

  .translate-bar{ display:flex; align-items:center; gap:10px; background:var(--primary-soft); border-radius:12px; padding:12px 14px; margin-bottom:16px; flex-wrap:wrap; }
  .translate-bar label{ font-size:12.5px; font-weight:700; color:var(--primary-dark); white-space:nowrap; }
  .translate-bar select{ flex:1; min-width:160px; }

  .role-block{ border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
  .role-pill{ font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); display:inline-block; margin-bottom:8px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 820px){ .two-col{ grid-template-columns:1fr; } .app{ flex-direction:column; height:auto; } .sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; } .nav-bottom{ margin-top:0; border-top:none; } }

  .toast{ position:fixed; top:18px; right:18px; background:var(--ink); color:#fff; padding:9px 16px; border-radius:10px; font-size:13.5px; z-index:50; }
  .output-box{ white-space:pre-wrap; font-size:14px; line-height:1.6; min-height:180px; }

  /* home cards */
  .dcard{ display:flex; flex-direction:column; }
  .dcard-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; position:relative; }
  .dcard-title{ font-size:14px; font-weight:600; }
  .stat-big{ display:flex; align-items:baseline; gap:6px; margin-bottom:2px; }
  .stat-big .num{ font-size:27px; font-weight:700; line-height:1; }
  .stat-big .lbl{ font-size:11.5px; color:var(--muted); }
  .note-input{ width:100%; height:33px; font-size:13.5px; font-weight:600; margin-bottom:2px; }
  .count-edit{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .count-edit input{ font-size:12.5px; padding:6px 8px; }
  .dcard-bar{ height:5px; border-radius:3px; background:var(--border); overflow:hidden; margin-bottom:12px; }
  .dcard-bar-fill{ height:100%; background:var(--primary); }
  .dcard-tasks{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .card-task-row{ display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .card-task-row input[type=checkbox]{ width:14px; height:14px; flex-shrink:0; }
  .card-add-task{ height:30px; font-size:12.5px; margin-top:auto; }
  .pin-menu{ display:none; position:absolute; top:30px; right:0; background:#fff; border:1px solid var(--border); border-radius:10px; padding:4px; flex-direction:column; min-width:150px; z-index:5; box-shadow:0 4px 14px rgba(32,34,58,.1); }
  .pin-menu.open{ display:flex; }
  .pin-menu button{ background:none; border:none; text-align:left; font-size:12.5px; padding:6px 8px; border-radius:6px; cursor:pointer; color:var(--ink); }
  .pin-menu button:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .addcard-tile{ border:1.5px dashed var(--border); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); cursor:pointer; min-height:170px; }
  .addcard-tile:hover{ color:var(--primary-dark); border-color:var(--primary); }
  .tag-pill{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--primary-soft); color:var(--primary-dark); }
  .wk-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .wk-table th{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; padding:6px 8px; text-align:center; border-bottom:1px solid var(--border); }
  .wk-table td{ padding:8px; text-align:center; border-bottom:1px solid var(--border); }
  .wk-table tfoot td{ border-bottom:none; border-top:2px solid var(--border); }
  .wk-today{ background:var(--primary-soft); }
  .wk-zero{ color:var(--border); }
  .wk-left{ color:var(--accent); font-weight:600; }
  .sweep-preview{ border:1px solid var(--border); border-radius:8px; padding:6px 8px; }
  .sweep-item{ font-size:12.5px; color:var(--muted); padding:2px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pgroup{ border:1px solid var(--border); border-radius:11px; padding:10px 12px; margin-bottom:8px; }
  .pgroup-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .also-in{ display:inline-flex; align-items:center; gap:2px; font-size:10.5px; font-weight:600; color:var(--primary-dark); background:var(--primary-soft); border-radius:999px; padding:1px 5px; vertical-align:middle; }
  .search-hit{ display:flex; align-items:flex-start; gap:8px; padding:9px 11px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }
  .search-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-head{ margin-bottom:4px; }
  .cal-dow{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; text-align:center; padding:4px 0; }
  .cal-cell{ position:relative; min-height:52px; border:1px solid var(--border); border-radius:9px; padding:5px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .cal-cell:hover{ border-color:var(--primary); }
  .cal-num{ font-size:12px; color:var(--ink); }
  .cal-dim{ opacity:.38; }
  .cal-today{ background:var(--primary-soft); border-color:var(--primary); }
  .cal-selected{ box-shadow:0 0 0 2px var(--primary); }
  .cal-dot{ font-size:10.5px; font-weight:700; background:var(--primary); color:#fff; border-radius:999px; padding:0 6px; }
  .cal-dot-late{ background:#D0453A; }
  .due-pill{ font-size:10.5px; font-weight:600; color:var(--muted); background:var(--border); border-radius:999px; padding:1px 6px; }
  .due-now{ background:var(--primary-soft); color:var(--primary-dark); }
  .due-late{ background:#FDECEA; color:#D0453A; }
  .wait-pill{ font-size:10.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:1px 6px; }
  .task-editor{ border:1px solid var(--border); border-radius:9px; padding:8px 9px; margin:2px 0 6px; }
</style>
</head>
<body>

<div id="root"></div>

<script>
const STORAGE_KEY = 'dispatch-state-v2';
const DEFAULT_STATE = {
  sender: { name: '', email: '' },
  roles: [
    { id: 'r_moving', label: 'Moving Member', locked: true },
    { id: 'r_enroller', label: 'Enroller', locked: true },
    { id: 'r_sponsor', label: 'Proposed Sponsor', locked: true },
  ],
  templates: [],
  people: {},        // legacy per-role directory — kept for data safety, no longer written to
  members: {},        // { [memberId]: { id, firstName, lastName, email, phone, country, sponsor, enroller, notes } }
  folders: [],
  lastLanguage: 'English (no translation)',
  categories: [
    { id: 'c_emails', label: 'Emails', featuredStat: 'remaining', noteText: '' },
    { id: 'c_transfers', label: 'Account Transfers', featuredStat: 'remaining', noteText: '' },
  ],
  dailyCounts: {},   // { 'YYYY-MM-DD': { [categoryId]: { assigned, completed } } }
  tasks: [],         // { id, text, done, createdDate, completedDate }
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let view = 'home';
let selectedFolderId = null; // null = all templates
let editingTemplateId = null;
let generatingTemplateId = null;
let genFieldValues = {};
let genLanguage = 'English (no translation)';
let genOutput = '';
let genSubject = '';
let genLoading = false;
let genError = '';
let toast = '';
let insertRoleSelection = 'sender';
let insertTargetId = 'tpl-body'; // 'tpl-body' or 'tpl-subject'
let templateSearchQuery = '';
let templateTagFilter = '';
let combineMode = false;
let combineSelection = [];
let combineLoading = false;
let combineError = '';
let combineResult = null; // { subject, body, sourceIds }
let addingCard = false;
let newCardLabel = '';
let newCardIncludeCategorized = false;
let patternsLoading = false;
let patternsError = '';
let patternGroups = null; // [{ name, taskIds, samples }]
let taskSearchQuery = '';
let showTaskDetail = false;
let calMonthOffset = 0;
let selectedCalDay = null;
let editingTaskId = null;

const WAITING_OPTIONS = ['', 'Member', 'Team Lead', 'Manager', 'Department', 'Other'];

function isOverdue(t){
  return !t.done && t.dueDate && t.dueDate < todayKey();
}
function isDueToday(t){
  return !t.done && t.dueDate === todayKey();
}

// ---------------- access passcode ----------------
let passcode = '';
try { passcode = localStorage.getItem('dispatch-key') || ''; } catch(e){}
let locked = false;
let lockError = '';
let setupMessage = '';

function authHeaders(extra){
  return Object.assign({ 'x-dispatch-key': passcode }, extra || {});
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function todayKey(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function blankMember(id){
  return { id, firstName:'', lastName:'', email:'', phone:'', country:'', sponsor:'', enroller:'', notes:'' };
}

// One-time-safe merge: folds the legacy per-role people[] lists into the single
// ID-keyed members directory. Never overwrites a field that's already populated,
// and never deletes state.people — this can run on every load with no data loss.
function migratePeopleIntoMembers(){
  if (!state.people) return;
  Object.keys(state.people).forEach(roleId => {
    (state.people[roleId] || []).forEach(rec => {
      const id = (rec.id || '').trim();
      if (!id) return;
      if (!state.members[id]) state.members[id] = blankMember(id);
      const m = state.members[id];
      if (!m.firstName && rec.firstName) m.firstName = rec.firstName;
      if (!m.lastName && rec.lastName) m.lastName = rec.lastName;
      if (!m.email && rec.email) m.email = rec.email;
    });
  });
}

// ---------------- state persistence (Netlify Blobs via serverless function) ----------------
// loadOk gates every write. If the initial load did not succeed, we must never
// save — otherwise an empty default state would overwrite real data on the server.
let loadOk = false;
let loadErrorMessage = '';

async function loadState(){
  try {
    const resp = await fetch('/.netlify/functions/state', { headers: authHeaders() });

    if (resp.status === 503) {
      const d = await resp.json().catch(()=>({}));
      setupMessage = d.message || 'Server setup incomplete.';
      render(); return;
    }
    if (resp.status === 401) {
      locked = true;
      lockError = passcode ? 'That passcode did not work.' : '';
      render(); return;
    }
    if (!resp.ok) throw new Error('The server returned an error (' + resp.status + ')');

    const data = await resp.json();
    if (data) state = Object.assign({}, DEFAULT_STATE, data);
    locked = false; lockError = ''; setupMessage = '';
    loadOk = true; loadErrorMessage = '';
  } catch (e) {
    loadOk = false;
    loadErrorMessage = e.message || 'Could not reach the server.';
    console.error('load failed', e);
    render();
    return;
  }
  if (!state.folders) state.folders = [];
  if (!state.categories) state.categories = [];
  state.categories.forEach(c => ensureCategoryDefaults(c));
  if (!state.tasks) state.tasks = [];
  state.tasks.forEach(t => {
    if (!Array.isArray(t.categoryIds)) {
      t.categoryIds = t.categoryId ? [t.categoryId] : [];
    }
    if (t.dueDate === undefined) t.dueDate = null;
    if (t.waitingOn === undefined) t.waitingOn = '';
  });
  if (!state.members) state.members = {};
  if (!state.templates) state.templates = [];
  state.templates.forEach(t => {
    if (!Array.isArray(t.tags)) t.tags = [];
    if (t.subject === undefined) t.subject = '';
  });
  migratePeopleIntoMembers();
  render();
}
async function saveState(){
  if (!loadOk) {
    showToast('Not saved — your data has not loaded yet');
    return;
  }
  try {
    const resp = await fetch('/.netlify/functions/state', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(state),
    });
    if (resp.status === 401) { locked = true; lockError = 'Your session was locked. Enter the passcode to continue.'; render(); return; }
    if (!resp.ok) throw new Error('Save failed (' + resp.status + ')');
  } catch(e){
    console.error('save failed', e);
    showToast('Save failed — check your connection');
  }
}
function showToast(msg){ toast = msg; render(); setTimeout(()=>{ toast=''; render(); }, 1800); }

function nameToken(label){ return `{{${label} Name}}`; }
function emailToken(label){ return `{{${label} Email}}`; }
function firstNameToken(label){ return `{{${label} First Name}}`; }
function lastNameToken(label){ return `{{${label} Last Name}}`; }
function idToken(label){ return `{{${label} ID}}`; }

function insertAtCursor(textarea, text){
  const start = textarea.selectionStart, end = textarea.selectionEnd;
  const val = textarea.value;
  textarea.value = val.slice(0,start) + text + val.slice(end);
  textarea.selectionStart = textarea.selectionEnd = start + text.length;
  textarea.focus();
}

function icon(name, size){
  const s = size || 16;
  const map = {
    sparkle: '<path d="M12 3l1.7 4.8L18.5 9.5l-4.8 1.7L12 16l-1.7-4.8L5.5 9.5l4.8-1.7L12 3z"/>',
    inbox: '<path d="M3 12h4.5l1.5 2.5h6L16.5 12H21"/><rect x="3" y="6" width="18" height="14" rx="2"/>',
    folder: '<path d="M3 7.5A1.5 1.5 0 014.5 6h4.7l1.8 2.2h8.5A1.5 1.5 0 0121 9.7v8.8A1.5 1.5 0 0119.5 20h-15A1.5 1.5 0 013 18.5v-11z"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-4 3-6.2 6.5-6.2s6.5 2.2 6.5 6.2"/><circle cx="17.5" cy="9.3" r="2.3"/><path d="M15.5 20c.2-3.1 1.9-5 5-5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4.2 20c0-4.4 3.5-7 7.8-7s7.8 2.6 7.8 7"/>',
    pencil: '<path d="M14.2 3.8l6 6L8.3 21.7l-6.1 1.1 1.1-6.1L14.2 3.8z"/>',
    trash: '<path d="M3.5 6.5h17"/><path d="M8.5 6.5v-2a1.5 1.5 0 011.5-1.5h4a1.5 1.5 0 011.5 1.5v2"/><path d="M6 6.5l1 14h10l1-14"/>',
    copy: '<rect x="9" y="9" width="11.5" height="11.5" rx="2.2"/><path d="M5 14.5V5.2A2.2 2.2 0 017.2 3h9.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chevronLeft: '<path d="M14.5 5l-7 7 7 7"/>',
    wand: '<path d="M4 20L18 6"/><path d="M15 3l1.2 2.8L19 7l-2.8 1.2L15 11l-1.2-2.8L11 7l2.8-1.2L15 3z"/>',
    idcard: '<rect x="3" y="5.5" width="18" height="13" rx="2.3"/><circle cx="8.3" cy="11.3" r="1.7"/><path d="M5.5 16c.4-1.7 1.6-2.5 2.8-2.5s2.4.8 2.8 2.5"/><path d="M13.5 10h5M13.5 13h5"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9s1.3-6.5 3.8-9z"/>',
    home: '<path d="M3.5 10.5L12 3l8.5 7.5"/><path d="M5.5 9.5V20a1 1 0 001 1h4.5v-6h2v6H17a1 1 0 001-1V9.5"/>',

// ---------------- render ----------------
function render(){
  const root = document.getElementById('root');

  if (setupMessage) { root.innerHTML = setupView(); return; }
  if (locked) { root.innerHTML = lockView(); attachLockHandlers(); return; }
  if (!loadOk) { root.innerHTML = loadFailedView(); attachLoadFailedHandlers(); return; }

  root.innerHTML = `
    <div class="app">
      ${sidebarHtml()}
      <main class="main"><div class="main-inner">${mainBody()}</div></main>
    </div>
    ${toast ? `<div class="toast">${toast}</div>` : ''}
  `;
  attachHandlers();
}

// ---------------- load failure (fail closed) ----------------
function readLegacyLocalState(){
  try {
    const raw = localStorage.getItem('dispatch-state-v2');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch(e){ return null; }
}

function loadFailedView(){
  const legacy = readLegacyLocalState();
  const legacyTemplates = legacy && Array.isArray(legacy.templates) ? legacy.templates.length : 0;
  return centeredShell(`
    <label class="section">Couldn't load your data</label>
    <p class="subtle" style="margin:8px 0 10px; font-size:13.5px;">${escapeHtml(loadErrorMessage)}</p>
    <p class="hint" style="margin:0 0 12px;">Nothing has been saved or changed. Your data on the server is untouched — this screen deliberately blocks the app so it can't be overwritten.</p>
    <button data-retry-load class="btn btn-primary btn-block" style="margin-bottom:8px;">Try again</button>
    ${legacyTemplates ? `
      <div style="border-top:1px solid var(--border); margin-top:12px; padding-top:12px;">
        <p class="hint" style="margin:0 0 8px;">This browser has older saved data with <strong>${legacyTemplates} template${legacyTemplates===1?'':'s'}</strong> in it. You can download it as a backup file now.</p>
        <button data-download-legacy class="btn btn-ghost btn-block">Download that backup</button>
      </div>
    ` : ''}
  `);
}

function attachLoadFailedHandlers(){
  const retry = document.querySelector('[data-retry-load]');
  if (retry) retry.onclick = () => { loadErrorMessage = 'Retrying…'; render(); loadState(); };

  const dl = document.querySelector('[data-download-legacy]');
  if (dl) dl.onclick = () => {
    const legacy = readLegacyLocalState();
    if (!legacy) return;
    downloadJson(legacy, 'dispatch-backup-from-browser.json');
  };
}

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function taskCategoryIds(t){

}
function addTaskToCategory(t, id){
  const ids = taskCategoryIds(t).slice();
  if (!ids.includes(id)) ids.push(id);
  t.categoryIds = ids;
}

// ---------------- keyword matching for auto-sorting tasks into cards ----------------
const MATCH_STOPWORDS = ['the','a','an','and','or','of','to','for','in','on','my','me','it','this','that'];

// Crude but predictable stemmer: "calls"/"calling"/"called" -> "call".
function stemWord(w){
  w = (w || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (w.length <= 3) return w;
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ing') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ed') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('es') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}

function keywordsFromLabel(label){
  return (label || '')
    .split(/\s+/)
    .map(stemWord)
    .filter(w => w && w.length > 2 && !MATCH_STOPWORDS.includes(w));
}

function taskMatchesKeywords(task, stems){
  if (!stems.length) return false;
  const words = (task.text || '').split(/\s+/).map(stemWord).filter(Boolean);
  return stems.some(s => words.includes(s));
}

// Tasks that would be swept into a card with this name. `includeCategorized`
// controls whether tasks already sitting in another card are eligible.
function tasksMatchingLabel(label, includeCategorized, excludeCatId){
  const stems = keywordsFromLabel(label);
  if (!stems.length) return [];
  return state.tasks.filter(t => {
    if (taskCategoryIds(t).includes(excludeCatId)) return false;
    if (!includeCategorized && taskCategoryIds(t).length) return false;
    return taskMatchesKeywords(t, stems);
  });
}

      <div style="display:flex; gap:8px; margin-top:auto;">

// ---------------- Dashboard ----------------
let weekOffset = 0; // 0 = this week, -1 = last week, etc.

function dateFromKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function keyFromDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

// Monday-start week containing today, shifted by weekOffset weeks.
function weekDays(offset){
  const today = new Date();
  const dow = today.getDay();               // 0=Sun … 6=Sat
  const mondayShift = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayShift + (offset * 7));
  const days = [];
  for (let i = 0; i < 5; i++) {             // Mon–Fri
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function patternsPanel(){

async function runFindPatterns(){
  const done = state.tasks.filter(t => t.done && t.text);
  if (done.length < 4) {
    patternsError = 'Not enough completed tasks yet to spot patterns.';
    patternGroups = null; render(); return;
  }
  patternsError = ''; patternsLoading = true; patternGroups = null; render();

  const list = done.map(t => `${t.id}|${t.text}`).join('\n');
  const instruction = `Below is a list of completed work tasks, one per line, formatted as "id|text".

Group them by what the task is actually about — the kind of work being done. Group by meaning, not exact wording: "call Maria", "phoned the sponsor", and "returned a call to the team lead" all belong to the same group.

Rules:
- Only create a group if it has 2 or more tasks.
- Give each group a short, plain name that would work as a category label, usually one or two words (e.g. "Calls", "Account transfers", "Follow-ups").
- Every id you return must come from the list. Do not invent ids or tasks.
- A task belongs to at most one group. Leave genuinely unrelated one-offs out entirely.
- Return at most 8 groups, most common first.

Return ONLY valid JSON, no markdown fences, in exactly this shape:
{"groups":[{"name":"Calls","ids":["task_abc","task_def"]}]}

Tasks:
${list}`;

  try {
    const resp = await fetch('/.netlify/functions/combine', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ instruction }),
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
    let parsed;
    try { parsed = JSON.parse((data.result||'').replace(/```json|```/g,'').trim()); }
    catch(e){ throw new Error('Could not read the result.'); }

    const byId = {};
    state.tasks.forEach(t => { byId[t.id] = t; });

    // Only trust ids that actually exist; the model must not invent tasks.
    patternGroups = (parsed.groups || [])
      .map(g => {
        const taskIds = (g.ids || []).filter(id => byId[id]);
        return { name: (g.name||'').trim(), taskIds, samples: taskIds.slice(0,3).map(id => byId[id].text) };
      })
      .filter(g => g.name && g.taskIds.length >= 2)
      .sort((a,b) => b.taskIds.length - a.taskIds.length);

    patternsLoading = false; render();
  } catch(e){
    patternsLoading = false;
    patternsError = e.message || 'Could not find patterns.';
    render();
  }
}

            <tr>
              <td style="text-align:left; font-weight:700;">Total</td>
              ${dayKeys.map(k => {
                const dayTotal = state.categories.reduce((s,c) => s + (((state.dailyCounts[k]||{})[c.id]||{}).completed || 0), 0);
                return `<td${k===todayK?' class="wk-today"':''} style="font-weight:700;">${dayTotal ? dayTotal : '<span class="wk-zero">·</span>'}</td>`;

// Tasks checked off per day. General gets its own row so uncategorized work is
// never invisible. A task in two cards shows in both rows but is only counted
// once in the totals.
function tasksTable(dayKeys, todayK){
  const doneInWeek = state.tasks.filter(t => t.done && dayKeys.includes(t.completedDate));
  if (!doneInWeek.length) {
    return `<div class="card" style="margin-top:16px;">
      <label class="section">Tasks checked off</label>
      <p class="subtle" style="margin:10px 0 0; font-size:13px;">Nothing checked off this week yet.</p>
    </div>`;
  }

  const rows = [];
  const generalPerDay = dayKeys.map(k => doneInWeek.filter(t => t.completedDate===k && taskCategoryIds(t).length===0));
  const generalTotal = doneInWeek.filter(t => taskCategoryIds(t).length===0).length;
  if (generalTotal) rows.push({ label:'General', perDay:generalPerDay, total:generalTotal, isGeneral:true });

  state.categories.forEach(c => {
    const perDay = dayKeys.map(k => doneInWeek.filter(t => t.completedDate===k && taskCategoryIds(t).includes(c.id)));
    const total = doneInWeek.filter(t => taskCategoryIds(t).includes(c.id)).length;
    if (total) rows.push({ label:c.label, perDay, total, isGeneral:false });
  });

  const distinctPerDay = dayKeys.map(k => doneInWeek.filter(t => t.completedDate===k).length);

  return `
    <div class="card" style="margin-top:16px; overflow-x:auto;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;">
        <label class="section" style="margin:0;">Tasks checked off</label>
        <button data-toggle-task-detail class="btn btn-ghost" style="padding:5px 11px; font-size:12.5px;">${showTaskDetail ? 'Hide titles' : 'Show titles'}</button>
      </div>
      <table class="wk-table">
        <thead><tr>
          <th style="text-align:left;">Where</th>
          ${dayKeys.map(k => `<th${k===todayK?' class="wk-today"':''}>${dateFromKey(k).toLocaleDateString(undefined,{weekday:'short'})}</th>`).join('')}
          <th>Total</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td style="text-align:left; font-weight:600;">${escapeHtml(r.label)}${r.isGeneral ? ` <span class="subtle" style="font-weight:400; font-size:11.5px;">no card</span>` : ''}</td>
              ${r.perDay.map((list,i) => `<td${dayKeys[i]===todayK?' class="wk-today"':''}>${list.length ? list.length : '<span class="wk-zero">·</span>'}</td>`).join('')}
              <td style="font-weight:700;">${r.total}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot><tr>
          <td style="text-align:left; font-weight:700;">Distinct tasks</td>
          ${distinctPerDay.map((n,i) => `<td${dayKeys[i]===todayK?' class="wk-today"':''} style="font-weight:700;">${n ? n : '<span class="wk-zero">·</span>'}</td>`).join('')}
          <td style="font-weight:700;">${doneInWeek.length}</td>
        </tr></tfoot>
      </table>
      ${generalTotal ? `<p class="hint" style="margin-top:10px;">${generalTotal} task${generalTotal===1?'':'s'} finished without a card. Run <strong>Find patterns</strong> above to see if they group into something worth making a card for.</p>` : ''}
      ${showTaskDetail ? `
        <div style="margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
          ${dayKeys.map(k => {
            const list = doneInWeek.filter(t => t.completedDate===k);
            if (!list.length) return '';
            return `
              <div style="margin-bottom:10px;">
                <p class="hint" style="margin:0 0 4px; font-weight:700;">${dateFromKey(k).toLocaleDateString(undefined,{weekday:'long'})} · ${list.length} done</p>
                ${list.slice(0,5).map(t => `<div class="sweep-item" style="color:var(--ink);">${escapeHtml(t.text)}</div>`).join('')}
                ${list.length>5 ? `<div class="hint" style="margin:2px 0 0;">+${list.length-5} more</div>` : ''}
              </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ---------------- Calendar ----------------
function monthGrid(offset){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();             // 0=Sun
  const shift = startDow === 0 ? 6 : startDow - 1;  // grid starts Monday
  const gridStart = new Date(year, month, 1 - shift);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    cells.push(d);
  }
  return { cells, month, year, label: base.toLocaleDateString(undefined,{month:'long', year:'numeric'}) };
}

function allTags(){
  const set = {};
  state.templates.forEach(t => (t.tags||[]).forEach(tag => { set[tag] = true; }));
  return Object.keys(set).sort();
}

function templateMatches(t, q, tagFilter){
  if (tagFilter && !(t.tags||[]).includes(tagFilter)) return false;
  if (!q) return true;
  const hay = [t.title, t.subject, t.body, ...(t.tags||[])].join(' ').toLowerCase();
  return hay.includes(q);
}

async function runCombine(){
  const picks = combineSelection.map(id => state.templates.find(t=>t.id===id)).filter(Boolean);
  if (picks.length < 2) return;
  combineError = ''; combineLoading = true; render();

  const payload = picks.map((t,i) => `--- TEMPLATE ${i+1}: ${t.title} ---\nSUBJECT: ${t.subject||'(none)'}\nBODY:\n${t.body||''}`).join('\n\n');

  const instruction = `You are merging several email templates into ONE natural, professional email.

Rules:
- Remove duplicate greetings, duplicate closings, and repeated sentences or explanations.
- Do NOT remove any distinct piece of substantive information — every unique fact, requirement, or instruction from every template must survive.
- Keep every placeholder token exactly as written, character for character, including the double braces. Example: {{Moving Member Name}}, {{Enroller Email}}, {{Moving Member ID}}. Never rename, translate, or reword a placeholder. If the same placeholder appears in multiple templates, include it once.
- Do not add a greeting line or a signature — those are added automatically elsewhere.
- Write one coherent email, not sections pasted together.

Return ONLY valid JSON, no markdown fences, in exactly this shape:
{"subject": "...", "body": "..."}

Here are the templates to merge:

${payload}`;

  try {
    const resp = await fetch('/.netlify/functions/combine', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ instruction }),
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok) throw new Error(data.error || ('Combine request failed (' + resp.status + ')'));
    let parsed;
    try {
      parsed = JSON.parse((data.result||'').replace(/```json|```/g,'').trim());
    } catch(e){ throw new Error('Could not read the combined result.'); }

    const mergedTags = [];
    picks.forEach(t => (t.tags||[]).forEach(tag => { if (!mergedTags.includes(tag)) mergedTags.push(tag); }));

    combineResult = {
      title: picks.map(t=>t.title).join(' + '),
      subject: parsed.subject || '',
      body: parsed.body || '',
      tags: mergedTags,
      sourceIds: combineSelection.slice(),
      requiredRoleIds: dedupeRoles(picks),
      recipientRoleId: picks[0].recipientRoleId || '',
      signerSource: picks[0].signerSource || 'sender',
      folderId: picks[0].folderId || '',
    };
    combineLoading = false;
    view = 'combineResult';
    render();
  } catch(e){
    combineLoading = false;
    combineError = e.message || 'Combine failed.';
    render();
  }
}

function dedupeRoles(picks){
  const out = [];
  picks.forEach(t => (t.requiredRoleIds||[]).forEach(id => { if (!out.includes(id)) out.push(id); }));
  return out;
}

function parseNameParts(raw){
  raw = raw.trim();
  if (raw.includes(',')) {
    const idx = raw.indexOf(',');
    return { firstName: raw.slice(idx+1).trim(), lastName: raw.slice(0, idx).trim() };
  }
  const tokens = raw.split(/\s+/).filter(Boolean);
  return { firstName: tokens[0] || '', lastName: tokens.slice(1).join(' ') };
}

function parseBulkImportLine(line){
  const trimmed = line.trim();
  if (!trimmed) return null;
  const m = trimmed.match(/^(.*?)(\d+)\s*$/);
  if (!m || !m[1].trim()) return { invalid: true };
  const { firstName, lastName } = parseNameParts(m[1]);
  if (!firstName) return { invalid: true };
  return { id: m[2], firstName, lastName };
}

function computeBulkPreview(text){
  const newRecords = [], skipped = [], invalid = [];
  const seen = {};
  text.split('\n').forEach(line => {
    if (!line.trim()) return;
    const parsed = parseBulkImportLine(line);
    if (!parsed || parsed.invalid) { invalid.push(line); return; }
    if (state.members[parsed.id] || seen[parsed.id]) { skipped.push(parsed.id); return; }
    seen[parsed.id] = true;
    newRecords.push(parsed);
  });
  return { newRecords, skipped, invalid };
}

function mergeIntoState(incoming){
  let addedTemplates = 0, addedMembers = 0, addedRoles = 0;

  // Roles first: templates reference roles by id, so a restored template is only
  // fully intact if its custom roles come back under their ORIGINAL ids.
  if (Array.isArray(incoming.roles)) {
    incoming.roles.forEach(r => {
      if (!r || !r.id || !r.label) return;
      if (state.roles.some(x => x.id === r.id)) return;
      state.roles.push({ id: r.id, label: r.label, locked: !!r.locked });
      addedRoles++;
    });
  }

  if (Array.isArray(incoming.templates)) {
    incoming.templates.forEach(t => {
      if (!t || !t.title) return;
      const exists = state.templates.some(x => x.id === t.id || (x.title === t.title && x.body === t.body));
      if (exists) return;
      const copy = Object.assign({}, t);
      if (!copy.id) copy.id = uid('tpl');
      if (!Array.isArray(copy.tags)) copy.tags = [];
      if (copy.subject === undefined) copy.subject = '';
      if (!Array.isArray(copy.requiredRoleIds)) copy.requiredRoleIds = [];
      state.templates.push(copy);
      addedTemplates++;
    });
  }
  if (incoming.members && typeof incoming.members === 'object') {
    Object.values(incoming.members).forEach(m => {
      if (!m || !m.id) return;
      if (state.members[m.id]) return;
      state.members[m.id] = Object.assign(blankMember(m.id), m);
      addedMembers++;
    });
  }
  if (incoming.people && typeof incoming.people === 'object') {
    Object.keys(incoming.people).forEach(roleId => {
      (incoming.people[roleId] || []).forEach(rec => {
        const id = (rec.id||'').trim();
        if (!id || state.members[id]) return;
        state.members[id] = Object.assign(blankMember(id), { firstName: rec.firstName||'', lastName: rec.lastName||'', email: rec.email||'' });
        addedMembers++;
      });
    });
  }
  if (Array.isArray(incoming.folders)) {
    incoming.folders.forEach(f => {
      if (!f || !f.id) return;
      if (!state.folders.some(x => x.id===f.id || x.name===f.name)) state.folders.push(f);
    });
  }
  return { addedTemplates, addedMembers, addedRoles };
}

          </div>
        ` : ''}
        <div class="output-box">${genOutput ? escapeHtml(genOutput) : '<span class="subtle">Fill in the fields, then hit Generate.</span>'}</div>
      </div>
    </div>
  `;
}

// ---------------- generation logic ----------------
function maybeParseCommaName(roleId){
  const firstKey = roleId + '_firstname', lastKey = roleId + '_lastname';
  [firstKey, lastKey].forEach(key => {
    const val = (genFieldValues[key] || '');
    if (val.includes(',')) {
      const parts = val.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length === 2) { genFieldValues[lastKey] = parts[0]; genFieldValues[firstKey] = parts[1]; }
    }
  });
}
function lookupPersonById(id){
  if (!id) return null;
  return (state.members && state.members[id]) || null;
}
function applyPersonLookup(roleId){
  const id = (genFieldValues[roleId+'_memberid'] || '').trim();
  const match = lookupPersonById(id);
  if (match) {
    genFieldValues[roleId+'_firstname'] = match.firstName;
    genFieldValues[roleId+'_lastname'] = match.lastName;
    genFieldValues[roleId+'_email'] = match.email;
    showToast(`Found ${match.firstName} ${match.lastName}`.trim());
  }
}
function savePeopleFromGenFields(t){
  state.members = state.members || {};
  t.requiredRoleIds.forEach(roleId => {
    const id = (genFieldValues[roleId+'_memberid'] || '').trim();
    if (!id) return;
    const existing = state.members[id] || blankMember(id);
    state.members[id] = Object.assign({}, existing, {
      id,
      firstName: genFieldValues[roleId+'_firstname'] || existing.firstName || '',
      lastName: genFieldValues[roleId+'_lastname'] || existing.lastName || '',
      email: genFieldValues[roleId+'_email'] || existing.email || '',
    });
  });
  saveState();
}

function fillTokens(text, t){
  let out = text || '';
  const senderName = genFieldValues.__sender_name ?? state.sender.name ?? '';
  const senderEmail = genFieldValues.__sender_email ?? state.sender.email ?? '';
  out = out.split('{{Sender Name}}').join(senderName);
  out = out.split('{{Sender Email}}').join(senderEmail);
  t.requiredRoleIds.forEach(id => {
    const r = state.roles.find(x=>x.id===id);
    if (!r) return;
    const firstName = genFieldValues[id+'_firstname'] || '';
    const lastName = genFieldValues[id+'_lastname'] || '';
    const email = genFieldValues[id+'_email'] || '';
    const memberId = genFieldValues[id+'_memberid'] || '';
    const fullName = [firstName, lastName].filter(Boolean).join(' ');
    out = out.split(nameToken(r.label)).join(fullName);
    out = out.split(firstNameToken(r.label)).join(firstName);
    out = out.split(lastNameToken(r.label)).join(lastName);
    out = out.split(emailToken(r.label)).join(email);
    out = out.split(idToken(r.label)).join(memberId);
  });
  return out;
}

function roleDataFor(t){
  const roleData = {};
  t.requiredRoleIds.forEach(id => {
    const r = state.roles.find(x=>x.id===id);
    if (!r) return;
    const firstName = genFieldValues[id+'_firstname'] || '';
    const lastName = genFieldValues[id+'_lastname'] || '';
    const email = genFieldValues[id+'_email'] || '';
    roleData[id] = { name: [firstName, lastName].filter(Boolean).join(' '), email, label: r.label };
  });
  return roleData;
}

function buildFilledSubject(t){
  return fillTokens(t.subject || '', t);
}

function buildFilledBody(t){
  const senderName = genFieldValues.__sender_name ?? state.sender.name ?? '';
  const senderEmail = genFieldValues.__sender_email ?? state.sender.email ?? '';
  const body = fillTokens(t.body || '', t);
  const roleData = roleDataFor(t);

  let greeting = '';
  if (t.recipientRoleId && roleData[t.recipientRoleId]) greeting = `Hello ${roleData[t.recipientRoleId].name || '[name]'},\n\n`;

  let signature = '';
  if (t.signerSource === 'sender') signature = `\n\n${senderName}\n${senderEmail}`;
  else if (roleData[t.signerSource]) signature = `\n\n${roleData[t.signerSource].name}\n${roleData[t.signerSource].email}`;

  return greeting + body + signature;
}

async function translateText(text, targetLang){
  const resp = await fetch("/.netlify/functions/translate", {
    method: "POST",
    headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ text, targetLang })
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Translation request failed (' + resp.status + ')'));
  if (!data.translated) throw new Error('No translation returned');
  return data.translated;
}

async function runGenerate(){
  const t = state.templates.find(x=>x.id===generatingTemplateId);
  if (!t) return;
  genError = '';
  savePeopleFromGenFields(t);
  const filledSubject = buildFilledSubject(t);
  const filledBody = buildFilledBody(t);

  if (genLanguage === 'English (no translation)') {
    genSubject = filledSubject; genOutput = filledBody; render(); return;
  }

  genLoading = true; genOutput = ''; genSubject = ''; render();
  try {
    const [subjectOut, bodyOut] = await Promise.all([
      filledSubject.trim() ? translateText(filledSubject, genLanguage) : Promise.resolve(''),
      translateText(filledBody, genLanguage),
    ]);
    genSubject = subjectOut; genOutput = bodyOut;
  } catch (e) {
    genError = 'Translation failed — showing the English version instead. ' + (e.message || '');
    genSubject = filledSubject; genOutput = filledBody;
  }
  genLoading = false; render();
}

  };

  const restoreBtn = document.querySelector('[data-restore-backup]');
  if (restoreBtn) restoreBtn.onclick = () => {
    const fileInput = document.getElementById('restore-file');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if (!file) { showToast('Pick a backup file first'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try { incoming = JSON.parse(reader.result); }
      catch(e){ showToast('That file could not be read'); return; }
      const { addedTemplates, addedMembers, addedRoles } = mergeIntoState(incoming);
      saveState(); render();
      showToast(`Restored ${addedTemplates} template${addedTemplates===1?'':'s'}, ${addedMembers} member${addedMembers===1?'':'s'}, ${addedRoles} role${addedRoles===1?'':'s'}`);
    };
    reader.readAsText(file);
  };

  const recoverLegacyBtn = document.querySelector('[data-recover-legacy]');
  if (recoverLegacyBtn) recoverLegacyBtn.onclick = () => {
    const legacy = readLegacyLocalState();
    if (!legacy) { showToast('Nothing found to recover'); return; }
    const { addedTemplates, addedMembers, addedRoles } = mergeIntoState(legacy);
    saveState(); render();
    showToast(`Recovered ${addedTemplates} template${addedTemplates===1?'':'s'}, ${addedMembers} member${addedMembers===1?'':'s'}, ${addedRoles} role${addedRoles===1?'':'s'}`);
  };

  const memberSearchEl = document.getElementById('member-search');
  if (memberSearchEl) memberSearchEl.oninput = () => {
    memberSearchQuery = memberSearchEl.value;
    const cursorPos = memberSearchEl.selectionStart;
    render();
    const refocused = document.getElementById('member-search');
    if (refocused) { refocused.focus(); refocused.setSelectionRange(cursorPos, cursorPos); }
  };

  const openAddMemberBtn = document.querySelector('[data-open-add-member]');
  if (openAddMemberBtn) openAddMemberBtn.onclick = () => {
    editingMemberId = 'new'; memberDraft = blankMember(''); bulkImportOpen = false; bulkPreview = null; render();
  };

  const openBulkImportBtn = document.querySelector('[data-open-bulk-import]');
  if (openBulkImportBtn) openBulkImportBtn.onclick = () => {
    bulkImportOpen = !bulkImportOpen; editingMemberId = null; memberDraft = null; bulkPreview = null; render();
  };

  document.querySelectorAll('[data-edit-member]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-edit-member');
    const m = state.members[id];
    if (!m) return;
    editingMemberId = id; memberDraft = Object.assign({}, m); bulkImportOpen = false; render();
  });

  document.querySelectorAll('[data-delete-member]').forEach(el => el.onclick = () => {
    const id = el.getAttribute('data-delete-member');
    if (!confirm('Delete this member? This cannot be undone.')) return;
    delete state.members[id];
    saveState(); render();
  });

  const saveMemberBtn = document.querySelector('[data-save-member]');
  if (saveMemberBtn) saveMemberBtn.onclick = () => {
    const isNew = editingMemberId === 'new';
    const id = document.getElementById('mf-id').value.trim();
    const firstName = document.getElementById('mf-first').value.trim();
    const lastName = document.getElementById('mf-last').value.trim();
    if (!id || !firstName || !lastName) { showToast('Member ID, first and last name are required'); return; }
    if (isNew && state.members[id]) { showToast('That Member ID already exists — edit it instead'); return; }
    const record = {
      id,
      firstName, lastName,
      email: document.getElementById('mf-email').value.trim(),
      phone: document.getElementById('mf-phone').value.trim(),
      country: document.getElementById('mf-country').value.trim(),
      sponsor: document.getElementById('mf-sponsor').value.trim(),
      enroller: document.getElementById('mf-enroller').value.trim(),
      notes: document.getElementById('mf-notes').value.trim(),
    };
    state.members[id] = record;
    editingMemberId = null; memberDraft = null;
    saveState(); render(); showToast('Member saved');
  };

  const cancelMemberBtn = document.querySelector('[data-cancel-member]');
  if (cancelMemberBtn) cancelMemberBtn.onclick = () => { editingMemberId = null; memberDraft = null; render(); };

  const previewBulkBtn = document.querySelector('[data-preview-bulk]');
  if (previewBulkBtn) previewBulkBtn.onclick = () => {
    bulkImportText = document.getElementById('bulk-import-text').value;
    bulkPreview = computeBulkPreview(bulkImportText);
    render();
  };

  const confirmBulkBtn = document.querySelector('[data-confirm-bulk]');
  if (confirmBulkBtn) confirmBulkBtn.onclick = () => {
    if (!bulkPreview) return;
    bulkPreview.newRecords.forEach(r => { state.members[r.id] = blankMember(r.id); state.members[r.id].firstName = r.firstName; state.members[r.id].lastName = r.lastName; });
    const count = bulkPreview.newRecords.length;
    saveState();
    bulkImportOpen = false; bulkImportText = ''; bulkPreview = null;
    render(); showToast(`${count} member${count===1?'':'s'} imported`);
  };

  const cancelBulkBtn = document.querySelector('[data-cancel-bulk]');
  if (cancelBulkBtn) cancelBulkBtn.onclick = () => { bulkImportOpen = false; bulkImportText = ''; bulkPreview = null; render(); };

  document.querySelectorAll('[data-gen-field]').forEach(el => el.oninput = () => { genFieldValues[el.getAttribute('data-gen-field')] = el.value; });
  document.querySelectorAll('[data-gen-field]').forEach(el => {
    const key = el.getAttribute('data-gen-field');
    if (key.endsWith('_firstname') || key.endsWith('_lastname')) {
      const roleId = key.replace(/_(firstname|lastname)$/, '');
      el.onblur = () => { maybeParseCommaName(roleId); render(); };
    }
    if (key.endsWith('_memberid')) {
      const roleId = key.replace(/_memberid$/, '');
      el.onblur = () => { applyPersonLookup(roleId); render(); };
    }
  });
  const langSel = document.getElementById('gen-language');
  if (langSel) langSel.onchange = () => { genLanguage = langSel.value; state.lastLanguage = langSel.value; saveState(); };
  const runBtn = document.querySelector('[data-run-generate]');
  if (runBtn) runBtn.onclick = runGenerate;
  const copyBtn = document.querySelector('[data-copy-output]');
  if (copyBtn) copyBtn.onclick = () => {
    const full = genSubject ? `Subject: ${genSubject}\n\n${genOutput}` : genOutput;
    navigator.clipboard.writeText(full).then(()=>showToast(genSubject ? 'Subject and body copied' : 'Copied'));
  };
  const copySubjectBtn = document.querySelector('[data-copy-subject]');
  if (copySubjectBtn) copySubjectBtn.onclick = () => {
    navigator.clipboard.writeText(genSubject).then(()=>showToast('Subject copied'));
  };
}

let __editorDraft = null;
function getEditorDraftFromDom(init){
  if (init || !__editorDraft) {
    __editorDraft = editingTemplateId
      ? JSON.parse(JSON.stringify(state.templates.find(t=>t.id===editingTemplateId)))
      : newTemplateDraft();
  }
  return __editorDraft;
}
function syncEditorDraftFromDom(){
  const d = getEditorDraftFromDom();
  d.title = document.getElementById('tpl-title')?.value ?? d.title;
  d.subject = document.getElementById('tpl-subject')?.value ?? d.subject;
  const tagsEl = document.getElementById('tpl-tags');
  if (tagsEl) d.tags = tagsEl.value.split(',').map(s => s.trim()).filter(Boolean);
  d.body = document.getElementById('tpl-body')?.value ?? d.body;
  d.recipientRoleId = document.getElementById('tpl-recipient')?.value ?? d.recipientRoleId;
  d.signerSource = document.getElementById('tpl-signer')?.value ?? d.signerSource;
  d.folderId = document.getElementById('tpl-folder')?.value ?? d.folderId;
  __editorDraft = d;
}
function persistEditorDraft(d){ __editorDraft = d; }

const origRender = render;
render = function(){ if (view !== 'editor') __editorDraft = null; origRender(); };

function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

loadState();
</script>
</body>
</html>
